name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter --disable-analytics
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  linux:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    # 24.04: the QR scanner's zxing-cpp needs a C++20 standard library newer than 22.04's.
    # The AppImage therefore needs glibc 2.39+ (distributions from 2024 onward).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev file
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter --disable-analytics
      - run: flutter build linux --release
        working-directory: app
      - run: packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/*.AppImage }

  windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter --disable-analytics
      - run: flutter build windows --release
        working-directory: app
      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path app/pubspec.yaml -Pattern '^version:\s*([^+]+)').Matches[0].Groups[1].Value
          $release = "app/build/windows/x64/runner/Release"
          # Ship the Visual C++ runtime next to the exe so users don't need to install it.
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR/System32/$dll" $release
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$release/*" -DestinationPath "dist/Offprint-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.zip }

  android:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      # Gradle distribution, plugins and Maven dependencies: restored instead of re-downloaded.
      - uses: gradle/actions/setup-gradle@v4
      # The NDK (needed for the QR scanner's C++ code) is over 1 GB; keep it between runs.
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: android-ndk-flutter-${{ env.FLUTTER_VERSION }}
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter --disable-analytics
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set: APKs will be signed with a debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" > app/android/key.properties
      - name: Build APKs
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
      - name: Collect
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' app/pubspec.yaml)
          out=app/build/app/outputs/flutter-apk
          mkdir -p dist
          cp "$out/app-release.apk" "dist/Offprint-$version-android-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$out/app-$abi-release.apk" "dist/Offprint-$version-android-$abi.apk"
          done
          rm -f app/android/key.properties "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/*.apk }

  release:
    needs: [linux, windows, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          generate_release_notes: true
