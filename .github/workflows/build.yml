name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter --disable-analytics
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  linux:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    # Older Ubuntu = older glibc = the AppImage runs on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev file
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter --disable-analytics
      - run: flutter build linux --release
        working-directory: app
      - run: packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/*.AppImage }

  windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter --disable-analytics
      - run: flutter build windows --release
        working-directory: app
      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path app/pubspec.yaml -Pattern '^version:\s*([^+]+)').Matches[0].Groups[1].Value
          $release = "app/build/windows/x64/runner/Release"
          # Ship the Visual C++ runtime next to the exe so users don't need to install it.
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR/System32/$dll" $release
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$release/*" -DestinationPath "dist/Offprint-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.zip }

  android:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter --disable-analytics
      - run: flutter build apk --release
        working-directory: app
      - name: Rename
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' app/pubspec.yaml)
          mkdir -p dist && cp app/build/app/outputs/flutter-apk/app-release.apk "dist/Offprint-$version-android.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/*.apk }

  release:
    needs: [linux, windows, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          generate_release_notes: true
