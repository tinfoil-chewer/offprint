[project]
name = "selphy"
version = "0.1.0"
description = "Reference implementation of SELPHY CP1500 printing (IPP + CPNP)"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.scripts]
selphy = "selphy.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
